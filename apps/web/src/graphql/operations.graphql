# Every GraphQL operation the web app sends. Outside development the gateway runs only these
# (ADR-0021, approved operations). After editing, run `pnpm --filter @chronos/web operations:gen`;
# a test fails if the generated files are out of date.

mutation RequestOtp($phone: String!) {
  requestOtp(phone: $phone) {
    challengeId
    expiresAt
    retryAfterSeconds
  }
}

mutation VerifyOtp($challengeId: ID!, $code: String!) {
  verifyOtp(challengeId: $challengeId, code: $code) {
    expiresAt
    account {
      id
      status
    }
  }
}

mutation RefreshSession {
  refreshSession {
    expiresAt
    account {
      id
      status
    }
  }
}

mutation SignOut {
  signOut
}

query Account {
  account {
    id
    status
  }
}

# Selfie verification (ADR-0022). The capture itself is posted to /api/verification/capture.

query Verification {
  verification {
    status
    failure
    attemptsRemaining
    reviewAvailable
  }
}

query VerificationConsent {
  consents {
    type
    policyVersion
    granted
  }
  currentPolicies {
    type
    version
  }
}

mutation RecordConsent($input: ConsentInput!) {
  recordConsent(input: $input)
}

mutation RequestVerificationReview {
  requestVerificationReview {
    status
    failure
    attemptsRemaining
    reviewAvailable
  }
}

# Onboarding (TASKS M1.7, ADR-0020): terms and privacy, then date of birth.

query OnboardingState {
  account {
    id
    status
  }
  consents {
    type
    policyVersion
    granted
  }
  currentPolicies {
    type
    version
  }
}

mutation SetDateOfBirth($dateOfBirth: Date!) {
  setDateOfBirth(dateOfBirth: $dateOfBirth) {
    id
    status
  }
}

# After activation (TASKS M1.7): PROFILE_REQUIRED from `me` means no profile yet.
query OnboardingProfile {
  me {
    id
  }
}

mutation CreateProfile($input: ProfileInput!) {
  updateProfile(input: $input) {
    id
    displayName
    sharesDistance
  }
}
