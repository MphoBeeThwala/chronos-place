name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No telemetry to third parties from build tooling.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Banned dependencies (CLAUDE.md rule 7)
        run: pnpm check:deps

  integration:
    name: Integration, vault isolation, service image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-integration-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Start the local stack (pulls images, waits for health checks)
        run: pnpm dev:infra
      - name: Vault database is unreachable from outside its network
        run: pnpm test:infra
      - name: Testcontainers-backed tests (KMS against LocalStack)
        run: pnpm test:integration
      - name: Service template, hardened image and Trivy scan
        run: pnpm test:service-template
      - name: Stack logs on failure
        if: failure()
        run: pnpm dev:infra:status || true

  privacy:
    name: Privacy leak tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-privacy-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-privacy-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Synthetic markers must not reach logs, events, errors, traces, URLs or notifications
        run: pnpm test:privacy

  contracts-breaking:
    name: Protobuf breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare with the base branch
        env:
          AGAINST_REF: origin/${{ github.base_ref }}
        run: pnpm --filter @chronos/contracts contracts:breaking

  e2e:
    name: Playwright E2E smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build the web app's workspace dependencies
        run: pnpm build --filter '@chronos/web^...'
      - name: Install Playwright browsers
        run: pnpm --filter @chronos/web exec playwright install --with-deps chromium
      - name: Build web app
        run: pnpm --filter @chronos/web build
        env:
          NODE_ENV: production
          SERVICE_NAME: web
          GATEWAY_URL: http://localhost:4000/graphql
      - name: Run Playwright smoke tests
        run: pnpm --filter @chronos/web test:e2e
        env:
          CI: true
          NODE_ENV: production
          SERVICE_NAME: web
          GATEWAY_URL: http://localhost:4000/graphql
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  terraform:
    name: Terraform validate & Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: '1.9.8'

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate (modules)
        run: |
          for dir in infra/terraform/modules/*/; do
            echo "--- Validating $dir ---"
            cd "$dir"
            terraform init -backend=false -input=false
            terraform validate
            cd - > /dev/null
          done

      - name: Terraform validate (dev env, no backend)
        run: |
          cd infra/terraform/envs/dev
          terraform init -backend=false -input=false
          terraform validate
          cd -

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@18b75ad18cf92c20f2b5b7695e5d53c72e9dc03f # v12.2922.0
        with:
          directory: infra/terraform
          config_file: infra/terraform/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3.28.9
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # The single check branch protection requires for this workflow.
  ci-gate:
    name: CI gate
    if: always()
    needs: [verify, integration, privacy, contracts-breaking, terraform, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job succeeded (or was intentionally skipped)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not succeed." >&2
              exit 1
            fi
          done
