syntax = "proto3";

package chronos.test.v1;

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc Fail(EchoRequest) returns (EchoResponse);
  rpc Boom(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string text = 1;
}

message EchoResponse {
  string text = 1;
  string request_id = 2;
}
