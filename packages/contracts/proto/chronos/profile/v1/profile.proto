syntax = "proto3";

package chronos.profile.v1;

import "google/protobuf/timestamp.proto";

// Profiles, prompts, interests and preferences (TASKS M1.5, ADR-0023).
//
// Conventions
// - Callers are authenticated by mTLS identity and checked against a per-method allow-list (M2.5).
//   Only the gateway calls these methods in M1.5.
// - No health data, ever (CLAUDE.md rule 1). Health details live only in the Health Vault, behind
//   the Disclosure Service. Free text written by members is never logged.
// - Coordinates are write-only and are never returned (CLAUDE.md rule 8). Other members see only
//   a rounded distance of at least 1 km.
// - gRPC status codes: INVALID_ARGUMENT for input outside the limits, NOT_FOUND when the member has
//   no profile yet. Error messages are fixed and never echo member input.
service ProfileService {
  // The member's own profile and preferences. NOT_FOUND until a profile is created. Caller: gateway.
  rpc GetOwnProfile(GetOwnProfileRequest) returns (GetOwnProfileResponse);
  // Creates or updates the member's profile. Only the fields that are set change. Creating a
  // profile needs a display name and an intent; preferences start at their defaults. Caller: gateway.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Updates the member's preferences. Needs a profile. Caller: gateway.
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
  // The prompt questions and interests members can choose from. Contains no member data. Caller: gateway.
  rpc GetCatalogue(GetCatalogueRequest) returns (GetCatalogueResponse);

  // Sets or clears the member's approximate location (ADR-0023 decision a). The service snaps the
  // point to a grid of about 1 km before storing it, whatever the client sent. Needs a profile.
  // Caller: gateway.
  rpc SetLocation(SetLocationRequest) returns (SetLocationResponse);
  // Profiles as another member sees them, with a rounded distance and never a coordinate (M1.5 AC).
  // Leaves out, without saying why: unknown ids, paused profiles, anyone blocked either way or in
  // private mode without having liked the viewer (matching decides, M3.1), accounts that are not
  // active, and the viewer. At most 50 ids; results keep the request order.
  // Callers: gateway, discovery (M3).
  rpc GetPublicProfiles(GetPublicProfilesRequest) returns (GetPublicProfilesResponse);
  // Members the viewer could be offered in discovery, nearest first (M3.2, ADR-0026): visible, with
  // a location within the viewer's distance, the viewer's intents, and age and gender fitting
  // both members' preferences. Ids and the private-mode flag only; matching then removes blocks,
  // members already seen and private members who did not like the viewer. Caller: discovery.
  rpc FindCandidates(FindCandidatesRequest) returns (FindCandidatesResponse);

  // Photos (TASKS M1.6, ADR-0024). Caller: gateway.
  // A presigned PUT into quarantine for one photo: valid 5 minutes, for exactly this content type
  // and byte length (JPEG, PNG or WebP, at most 10 MB). Needs a profile and fewer than 6 photos.
  rpc CreatePhotoUpload(CreatePhotoUploadRequest) returns (CreatePhotoUploadResponse);
  // Processes an upload: re-encodes it without metadata (no GPS), stores three sizes, deletes the
  // original and adds the photo last. New photos are PENDING until moderation approves them.
  rpc CompletePhotoUpload(CompletePhotoUploadRequest) returns (CompletePhotoUploadResponse);
  // The member's own photos, every status, in order, with links valid for 1 hour.
  rpc ListOwnPhotos(ListOwnPhotosRequest) returns (ListOwnPhotosResponse);
  // Puts the member's photos in the order given. The ids must be exactly their current photos.
  rpc ReorderPhotos(ReorderPhotosRequest) returns (ReorderPhotosResponse);
  // Deletes a photo and every size of it at once.
  rpc DeletePhoto(DeletePhotoRequest) returns (DeletePhotoResponse);

  // Everything profile holds about the member, for "Download my data" (TASKS M1.8, ADR-0025),
  // including the stored location, which only the member themselves ever sees. Photos come with
  // links valid for 24 hours. Caller: gateway.
  rpc ExportProfile(ExportProfileRequest) returns (ExportProfileResponse);
}

enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_LONG_TERM = 1;
  INTENT_DATING = 2;
  INTENT_FRIENDSHIP = 3;
  INTENT_OPEN = 4;
}

message PromptAnswer {
  // An id from the catalogue.
  string prompt_id = 1;
  // At most 300 characters.
  string answer = 2;
}

message Profile {
  string account_id = 1;
  string display_name = 2;
  string bio = 3;
  Intent intent = 4;
  string gender = 5;
  string pronouns = 6;
  // The member's own description of their area, such as "Johannesburg North". Optional.
  string area_label = 7;
  // Data flag only until discovery enforces it (ADR-0010): visible only to members they liked.
  bool private_mode = 8;
  // False while the member has paused their profile.
  bool visible = 9;
  // At most 3, in display order.
  repeated PromptAnswer prompts = 10;
  // Interest ids from the catalogue, at most 5.
  repeated string interests = 11;
  // True once the member has shared an approximate location (M1.5 part 2). The location itself is
  // never returned, not even to its owner.
  bool has_location = 12;
}

message Preferences {
  // 18 to 99. 18 is a hard floor.
  int32 age_min = 1;
  int32 age_max = 2;
  // 1 to 300.
  int32 max_distance_km = 3;
  // Empty means every intent.
  repeated Intent intents = 4;
  // Free-text genders the member wants to see. Empty means everyone.
  repeated string genders = 5;
}

message GetOwnProfileRequest {
  string account_id = 1;
}

message GetOwnProfileResponse {
  Profile profile = 1;
  Preferences preferences = 2;
}

message UpdateProfileResponse {
  Profile profile = 1;
  Preferences preferences = 2;
}

message UpdatePreferencesResponse {
  Profile profile = 1;
  Preferences preferences = 2;
}

message PromptList {
  repeated PromptAnswer items = 1;
}

message InterestList {
  repeated string ids = 1;
}

message UpdateProfileRequest {
  string account_id = 1;
  // Unset fields keep their value. An empty string clears an optional text field.
  optional string display_name = 2;
  optional string bio = 3;
  Intent intent = 4;
  optional string gender = 5;
  optional string pronouns = 6;
  optional string area_label = 7;
  optional bool private_mode = 8;
  optional bool visible = 9;
  // When set, replaces all prompt answers.
  PromptList prompts = 10;
  // When set, replaces all interests.
  InterestList interests = 11;
}

message StringList {
  repeated string values = 1;
}

message IntentList {
  repeated Intent values = 1;
}

message UpdatePreferencesRequest {
  string account_id = 1;
  optional int32 age_min = 2;
  optional int32 age_max = 3;
  optional int32 max_distance_km = 4;
  // When set, replaces the intents. An empty list means every intent.
  IntentList intents = 5;
  // When set, replaces the genders. An empty list means everyone.
  StringList genders = 6;
}

message PromptQuestion {
  string id = 1;
  string question = 2;
}

message Interest {
  string id = 1;
  string label = 2;
}

message GetCatalogueRequest {}

message GetCatalogueResponse {
  repeated PromptQuestion prompts = 1;
  repeated Interest interests = 2;
}

message SetLocationRequest {
  string account_id = 1;
  // WGS 84 degrees. Ignored when clear is true.
  double latitude = 2;
  double longitude = 3;
  // Removes the stored location.
  bool clear = 4;
}

message SetLocationResponse {
  Profile profile = 1;
  Preferences preferences = 2;
}

message GetPublicProfilesRequest {
  string viewer_account_id = 1;
  repeated string account_ids = 2;
}

// Another member's profile. No coordinates, no date of birth and no health data.
message PublicProfile {
  string account_id = 1;
  string display_name = 2;
  // Whole years, from identity.
  int32 age = 3;
  string bio = 4;
  Intent intent = 5;
  string gender = 6;
  string pronouns = 7;
  string area_label = 8;
  // Whole kilometres, at least 1; rounded to 5 km above 10 km. Unset when either member has not
  // shared a location.
  optional int32 distance_km = 9;
  repeated PromptAnswer prompts = 10;
  repeated string interests = 11;
  bool verified = 12;
  // Approved photos only, in the member's order (ADR-0024 decision e).
  repeated Photo photos = 13;
}

message GetPublicProfilesResponse {
  repeated PublicProfile profiles = 1;
}

enum PhotoModeration {
  PHOTO_MODERATION_UNSPECIFIED = 0;
  PHOTO_MODERATION_PENDING = 1;
  PHOTO_MODERATION_APPROVED = 2;
  PHOTO_MODERATION_REJECTED = 3;
}

// One size of a photo. The URL is a presigned GET valid for 1 hour; never cache it longer.
message PhotoVariant {
  // Long side in pixels: 320, 640 or 1280 (smaller when the original was smaller).
  int32 size = 1;
  string url = 2;
}

message Photo {
  string id = 1;
  // 0 to 5, the first is the main photo.
  int32 position = 2;
  // Always APPROVED in another member's view.
  PhotoModeration moderation = 3;
  repeated PhotoVariant variants = 4;
  // Of the largest size.
  int32 width = 5;
  int32 height = 6;
}

message CreatePhotoUploadRequest {
  string account_id = 1;
  // image/jpeg, image/png or image/webp. The stored file is checked from its bytes regardless.
  string content_type = 2;
  int32 byte_length = 3;
}

message CreatePhotoUploadResponse {
  string upload_id = 1;
  // PUT the file here with exactly this Content-Type and Content-Length.
  string upload_url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CompletePhotoUploadRequest {
  string account_id = 1;
  string upload_id = 2;
}

message CompletePhotoUploadResponse {
  Photo photo = 1;
}

message ListOwnPhotosRequest {
  string account_id = 1;
}

message ListOwnPhotosResponse {
  repeated Photo photos = 1;
}

message ReorderPhotosRequest {
  string account_id = 1;
  repeated string photo_ids = 2;
}

message ReorderPhotosResponse {
  repeated Photo photos = 1;
}

message DeletePhotoRequest {
  string account_id = 1;
  string photo_id = 2;
}

message DeletePhotoResponse {
  repeated Photo photos = 1;
}

message ExportProfileRequest {
  string account_id = 1;
}

// The member's stored location: already approximate (rounded in the browser, ADR-0023).
message StoredLocation {
  double latitude = 1;
  double longitude = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ExportProfileResponse {
  // Unset when the member never created a profile.
  Profile profile = 1;
  Preferences preferences = 2;
  // Unset when none is stored.
  StoredLocation location = 3;
  // Every status, in order, with links valid for 24 hours.
  repeated Photo photos = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

enum CandidatesOutcome {
  CANDIDATES_OUTCOME_UNSPECIFIED = 0;
  CANDIDATES_OUTCOME_OK = 1;
  // The viewer has no profile yet.
  CANDIDATES_OUTCOME_NO_PROFILE = 2;
  // The viewer has not shared a location: the app asks them to (ADR-0026).
  CANDIDATES_OUTCOME_NO_LOCATION = 3;
}

message Candidate {
  string account_id = 1;
  bool private_mode = 2;
  // Ranking v1's signals (M3.3, ADR-0027), each 0 to 100. No health data, no distance, no date.
  RankingFeatures features = 3;
}

message RankingFeatures {
  // 100 next door, 0 at the viewer's distance limit.
  int32 closeness = 1;
  // 100 active today, 60 this week, 30 this month, 0 longer ago. Never shown to anyone.
  int32 activity = 2;
  // 50 when the candidate's intents include the viewer's, 50 when the viewer is within the
  // candidate's own distance.
  int32 mutual_fit = 3;
  // Bio 20, prompts 25, interests 10, verified 25, one approved photo 20 (photos count lightly).
  int32 completeness = 4;
  // 100 on the day they joined, fading to 0 after 14 days.
  int32 newness = 5;
}

message FindCandidatesRequest {
  string viewer_account_id = 1;
  // At most 500; 0 means 500.
  int32 page_size = 2;
  // From next_page_token; empty for the nearest.
  string page_token = 3;
}

message FindCandidatesResponse {
  CandidatesOutcome outcome = 1;
  // Nearest first. A page can hold fewer than page_size, or none, and still have a next page.
  repeated Candidate candidates = 2;
  // Empty when there are no more.
  string next_page_token = 3;
}
