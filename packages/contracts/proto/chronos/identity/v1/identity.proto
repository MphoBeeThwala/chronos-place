syntax = "proto3";

package chronos.identity.v1;

import "google/protobuf/timestamp.proto";

// Accounts, phone OTP and sessions (TASKS M1.1, ADR-0018).
//
// Conventions
// - Callers are authenticated by mTLS identity and checked against a per-method allow-list (M2.5).
//   Only the gateway calls this service in M1.1.
// - Phone numbers cross this boundary only in RequestOtpRequest. Responses never echo them.
// - Client context (device id, IP) is passed by the gateway, which takes it from the request; it
//   feeds rate limits and binds refresh tokens to a device. It is never returned.
// - Tokens are returned to the gateway only. The gateway puts them in httpOnly cookies and never
//   exposes them to browser JavaScript (ADR-0017).
// - gRPC status codes: INVALID_ARGUMENT for malformed input (including numbers outside South
//   Africa), RESOURCE_EXHAUSTED when a rate limit or lockout applies, UNAUTHENTICATED for a wrong,
//   expired or used code or token, FAILED_PRECONDITION for an action the account's state does not
//   allow. Error messages are fixed and generic: they never say whether a number has an account.
service IdentityService {
  // Sends a one-time code to a South African mobile number. Caller: gateway.
  rpc RequestOtp(RequestOtpRequest) returns (RequestOtpResponse);
  // Checks a code. Creates the account on first sign-in and opens a session. Caller: gateway.
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  // Exchanges a refresh token for a new pair. The old refresh token stops working. Reusing a
  // refresh token that was already exchanged revokes the whole session. Caller: gateway.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  // Ends one session (sign out). Idempotent. Caller: gateway.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Ends every session of an account. Idempotent. Caller: gateway.
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
  // Records the date of birth after sign-in and applies the 18+ rule. Caller: gateway.
  rpc SetDateOfBirth(SetDateOfBirthRequest) returns (SetDateOfBirthResponse);
  // Returns the account's state. Caller: gateway.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  // Public keys the gateway uses to verify access tokens locally. Contains no member data. Caller: gateway.
  rpc GetSigningKeys(GetSigningKeysRequest) returns (GetSigningKeysResponse);

  // Consent (TASKS M1.2). History is append-only: a withdrawal is a new record. Caller: gateway.
  // Records a grant or withdrawal of the current policy version. Withdrawing health processing
  // queues erasure of the member's health data; withdrawing terms or privacy starts account deletion.
  rpc RecordConsent(RecordConsentRequest) returns (RecordConsentResponse);
  // The member's full consent history, oldest first. Caller: gateway.
  rpc ListConsents(ListConsentsRequest) returns (ListConsentsResponse);
  // The policy versions members must accept now. Contains no member data. Caller: gateway.
  rpc GetCurrentPolicies(GetCurrentPoliciesRequest) returns (GetCurrentPoliciesResponse);

  // Liveness verification (TASKS M1.4, ADR-0022). Caller: gateway.
  // Submits one capture for checking. Needs an active account, the biometric verification consent
  // at its current version, no check already running and attempts left. The result arrives later:
  // poll GetVerification.
  rpc SubmitLiveness(SubmitLivenessRequest) returns (SubmitLivenessResponse);
  // The member's verification state. Caller: gateway.
  rpc GetVerification(GetVerificationRequest) returns (GetVerificationResponse);
  // Asks for a person to review the latest failed check (after 3 failed attempts). Caller: gateway.
  rpc RequestVerificationReview(RequestVerificationReviewRequest) returns (RequestVerificationReviewResponse);

  // Facts other members may see about a member (TASKS M1.5, ADR-0023 decision f): age in whole
  // years and the verified badge. Never a date of birth. Only active accounts are returned; any
  // other id is left out without saying why. At most 100 ids. Caller: profile.
  rpc GetMemberFacts(GetMemberFactsRequest) returns (GetMemberFactsResponse);
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // Signed in, but the date of birth has not been given yet. Only onboarding actions are allowed.
  ACCOUNT_STATUS_PENDING_ONBOARDING = 1;
  ACCOUNT_STATUS_ACTIVE = 2;
  // The date of birth given is under 18. The account cannot be used.
  ACCOUNT_STATUS_INELIGIBLE = 3;
  ACCOUNT_STATUS_SUSPENDED = 4;
  ACCOUNT_STATUS_PENDING_ERASURE = 5;
}

// Request context supplied by the gateway.
message ClientContext {
  // Random id the client keeps for this browser or device. Not a hardware identifier.
  string device_id = 1;
  // The caller's IP address as seen by the edge.
  string ip = 2;
}

message RequestOtpRequest {
  // E.164, South African mobile numbers only at launch (+27, 9 digits after the country code).
  string phone_e164 = 1;
  ClientContext client = 2;
}

message RequestOtpResponse {
  string challenge_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  // How long the client must wait before asking for another code.
  int32 retry_after_seconds = 3;
}

message VerifyOtpRequest {
  string challenge_id = 1;
  string code = 2;
  ClientContext client = 3;
}

// Access and refresh tokens. Handed to the gateway, which keeps them in httpOnly cookies.
message SessionTokens {
  // Signed JWT, valid for 10 minutes.
  string access_token = 1;
  google.protobuf.Timestamp access_expires_at = 2;
  // Opaque, single use, valid for 30 days, bound to the device in ClientContext.
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message Account {
  string account_id = 1;
  AccountStatus status = 2;
  // True once a liveness check has passed (M1.4).
  bool verified = 3;
}

message VerifyOtpResponse {
  Account account = 1;
  SessionTokens tokens = 2;
  // True when this sign-in created the account.
  bool created = 3;
}

message RefreshSessionRequest {
  string refresh_token = 1;
  ClientContext client = 2;
}

message RefreshSessionResponse {
  Account account = 1;
  SessionTokens tokens = 2;
}

message RevokeSessionRequest {
  // The session to end, taken from the access token's claims by the gateway.
  string session_id = 1;
  string account_id = 2;
}

message RevokeSessionResponse {}

message RevokeAllSessionsRequest {
  string account_id = 1;
}

message RevokeAllSessionsResponse {}

// A calendar date with no time zone.
message CalendarDate {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message SetDateOfBirthRequest {
  string account_id = 1;
  CalendarDate date_of_birth = 2;
}

message SetDateOfBirthResponse {
  // ACTIVE when the member is 18 or older, INELIGIBLE otherwise.
  Account account = 1;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message GetSigningKeysRequest {}

message SigningKey {
  // Key id, matching the "kid" header of access tokens.
  string kid = 1;
  // Public key as a JSON Web Key (JWK) document.
  string jwk_json = 2;
}

message GetSigningKeysResponse {
  repeated SigningKey keys = 1;
}

enum ConsentType {
  CONSENT_TYPE_UNSPECIFIED = 0;
  CONSENT_TYPE_TERMS = 1;
  CONSENT_TYPE_PRIVACY = 2;
  // Separate, optional consent to process health information (POPIA special personal information).
  CONSENT_TYPE_HEALTH_PROCESSING = 3;
  CONSENT_TYPE_MARKETING = 4;
  // Separate consent to a selfie liveness check (POPIA: biometric information). Withdrawing it
  // deletes the stored capture, asks the vendor to delete its copy and removes the verified badge.
  CONSENT_TYPE_BIOMETRIC_VERIFICATION = 5;
}

message RecordConsentRequest {
  string account_id = 1;
  ConsentType type = 2;
  // Must be the current version of that policy (GetCurrentPolicies).
  string policy_version = 3;
  bool granted = 4;
}

message RecordConsentResponse {
  Account account = 1;
}

message ConsentRecord {
  ConsentType type = 1;
  string policy_version = 2;
  bool granted = 3;
  google.protobuf.Timestamp recorded_at = 4;
}

message ListConsentsRequest {
  string account_id = 1;
}

message ListConsentsResponse {
  repeated ConsentRecord records = 1;
}

message PolicyVersion {
  ConsentType type = 1;
  string version = 2;
}

message GetCurrentPoliciesRequest {}

message GetCurrentPoliciesResponse {
  repeated PolicyVersion policies = 1;
}

// One capture from the web capture component: a selfie plus the frames used for the liveness check.
// JPEG only. At most 3 MB in total and 12 frames. Never logged.
message LivenessCapture {
  bytes selfie_jpeg = 1;
  repeated bytes liveness_frames_jpeg = 2;
}

message SubmitLivenessRequest {
  string account_id = 1;
  LivenessCapture capture = 2;
}

message SubmitLivenessResponse {
  Verification verification = 1;
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_UNVERIFIED = 1;
  // A check is running.
  VERIFICATION_STATUS_PENDING = 2;
  VERIFICATION_STATUS_VERIFIED = 3;
  // The latest check did not pass. The member can try again while attempts remain.
  VERIFICATION_STATUS_FAILED = 4;
  // A person will review the latest failed check.
  VERIFICATION_STATUS_IN_REVIEW = 5;
}

// Why a check did not pass, coarse on purpose. Scores and vendor details are never stored or shared.
enum VerificationFailure {
  VERIFICATION_FAILURE_UNSPECIFIED = 0;
  // The photos were too dark, blurred or had no clear face. Trying again usually helps.
  VERIFICATION_FAILURE_POOR_QUALITY = 1;
  // The check could not confirm a live person.
  VERIFICATION_FAILURE_NOT_CONFIRMED = 2;
  // The check could not be completed. It does not count as a failed attempt.
  VERIFICATION_FAILURE_UNAVAILABLE = 3;
}

message Verification {
  VerificationStatus status = 1;
  // Set when status is FAILED.
  VerificationFailure failure = 2;
  // Attempts left before the hourly or daily limit applies.
  int32 attempts_remaining = 3;
  // True when the member may ask for a person to review their latest failed check.
  bool review_available = 4;
}

message GetVerificationRequest {
  string account_id = 1;
}

message GetVerificationResponse {
  Verification verification = 1;
}

message RequestVerificationReviewRequest {
  string account_id = 1;
}

message RequestVerificationReviewResponse {
  Verification verification = 1;
}

message GetMemberFactsRequest {
  repeated string account_ids = 1;
}

message MemberFacts {
  string account_id = 1;
  // Whole years, on today's date in South Africa. Always 18 or more.
  int32 age = 2;
  bool verified = 3;
}

message GetMemberFactsResponse {
  repeated MemberFacts members = 1;
}
